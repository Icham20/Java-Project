version: '3.8'
services:
  mysqldb:
    image: mysql:8.0
    container_name: projet_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projet_db
      MYSQL_USER: user_projet
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql